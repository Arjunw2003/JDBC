<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration Form</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Custom CSS -->
<style>
body {
	background-color: #f2f4f7;
	font-family: Arial, sans-serif;
}

.registration-container {
	max-width: 850px;
	margin: 40px auto;
}

.registration-card {
	background-color: white;
	padding: 30px;
	border-radius: 12px;
	box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.15);
}

.form-title {
	text-align: center;
	margin-bottom: 30px;
	font-weight: bold;

.form-label {
	font-weight: 600;
}

.btn-register {
	width: 150px;
}

.btn-reset {
	width: 150px;

</style>
```

</head>

<body>


	<div class="container registration-container">

		<div class="registration-card">

			<h2 class="form-title">Student Registration Form</h2>

			<form action="register" method="post">

				<!-- First Name & Last Name -->
				<div class="row">

					<div class="col-md-6 mb-3">

						<label class="form-label"> First Name </label> <input type="text"
							name="fname" class="form-control" placeholder="Enter First Name">

					</div>


					<div class="col-md-6 mb-3">

						<label class="form-label"> Last Name </label> <input type="text"
							name="lname" class="form-control" placeholder="Enter Last Name">

					</div>

				</div>


				<!-- Age & City -->
				<div class="row">

					<div class="col-md-6 mb-3">

						<label class="form-label"> Age </label> <input type="number"
							name="age" class="form-control" placeholder="Enter Age">

					</div>


					<div class="col-md-6 mb-3">

						<label class="form-label"> City </label> <input type="text"
							name="city" class="form-control" placeholder="Enter City">

					</div>

				</div>


				<!-- Mobile & Email -->
				<div class="row">

					<div class="col-md-6 mb-3">

						<label class="form-label"> Mobile No </label> <input type="tel"
							name="mobile" class="form-control"
							placeholder="Enter Mobile Number" maxlength="10">

					</div>


					<div class="col-md-6 mb-3">

						<label class="form-label"> Email </label> <input type="email"
							name="email" class="form-control" placeholder="Enter Email">

					</div>

				</div>


				<!-- Password & DOB -->
				<div class="row">

					<div class="col-md-6 mb-3">

						<label class="form-label"> Password </label> <input
							type="password" name="password" class="form-control"
							placeholder="Enter Password">

					</div>


					<div class="col-md-6 mb-3">

						<label class="form-label"> Date of Birth </label> <input
							type="date" name="dob" class="form-control">

					</div>

				</div>


				<!-- 10th & 12th -->
				<div class="row">

					<div class="col-md-6 mb-3">

						<label class="form-label"> 10th Percentage </label> <input
							type="number" name="tenthPercentage" class="form-control"
							placeholder="Enter 10th Percentage" step="0.01">

					</div>


					<div class="col-md-6 mb-3">

						<label class="form-label"> 12th Percentage </label> <input
							type="number" name="twelfthPercentage" class="form-control"
							placeholder="Enter 12th Percentage" step="0.01">

					</div>

				</div>


				<!-- Graduation -->
				<div class="mb-3">

					<label class="form-label"> Graduation Percentage </label> <input
						type="number" name="graduationPercentage" class="form-control"
						placeholder="Enter Graduation Percentage" step="0.01">

				</div>


				<!-- Gender -->
				<div class="mb-4">

					<label class="form-label d-block"> Gender </label>

					<div class="form-check form-check-inline">

						<input class="form-check-input" type="radio" name="gender"
							value="Male"> <label class="form-check-label">
							Male </label>

					</div>


					<div class="form-check form-check-inline">

						<input class="form-check-input" type="radio" name="gender"
							value="Female"> <label class="form-check-label">
							Female </label>

					</div>


					<div class="form-check form-check-inline">

						<input class="form-check-input" type="radio" name="gender"
							value="Other"> <label class="form-check-label">
							Other </label>

					</div>

				</div>


				<!-- Buttons -->
				<div class="text-center">

					<input type="submit" value="Register"
						class="btn btn-primary btn-register me-2"> <input
						type="reset" value="Reset" class="btn btn-secondary btn-reset">
						<a href="login.html"> Already Login....  </a>

				</div>

			</form>

		</div>

	</div>


	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>

</html>
