<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Registration</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Custom CSS -->
<style>
body {
	background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	font-family: Arial, sans-serif;
}

.registration-card {
	width: 100%;
	max-width: 550px;
	background: #ffffff;
	padding: 35px;
	border-radius: 15px;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}

.registration-title {
	text-align: center;
	margin-bottom: 30px;
	font-weight: 700;
	color: #0d6efd;
}

.form-label {
	font-weight: 600;
}

.form-control {
	height: 45px;
	border-radius: 8px;
}

.form-control:focus {
	border-color: #0d6efd;
	box-shadow: 0 0 5px rgba(13, 110, 253, 0.3);
}

.btn-register {
	width: 100%;
	height: 45px;
	border-radius: 8px;
	font-weight: 600;
	margin-top: 10px;
}
</style>
</head>

<body>

	<div class="container">

		<div class="registration-card mx-auto">

			<h2 class="registration-title">Employee Registration</h2>

			<form action="register" method="post">

				<!-- Employee ID -->
				<div class="mb-3">
					<label for="empId" class="form-label"> Employee ID </label> <input
						type="number" class="form-control" id="empId" name="empId"
						placeholder="Enter Employee ID" >
				</div>


				<!-- Employee Name -->
				<div class="mb-3">
					<label for="empName" class="form-label"> Employee Name </label> <input
						type="text" class="form-control" id="empName" name="empName"
						placeholder="Enter Employee Name" >
				</div>


				<!-- Age -->
				<div class="mb-3">
					<label for="age" class="form-label"> Age </label> <input
						type="number" class="form-control" id="age" name="age"
						placeholder="Enter Age" min="18" max="60" >
				</div>


				<!-- City -->
				<div class="mb-3">
					<label for="city" class="form-label"> City </label> <input
						type="text" class="form-control" id="city" name="city"
						placeholder="Enter City" >
				</div>


				<!-- Salary -->
				<div class="mb-3">
					<label for="salary" class="form-label"> Salary </label> <input
						type="number" class="form-control" id="salary" name="salary"
						placeholder="Enter Salary" min="0" >
				</div>


				<!-- Buttons -->
				<div class="d-grid gap-2">

					<button type="submit" class="btn btn-primary btn-register" value="register">
						Register Employee</button>

					<button type="reset" class="btn btn-outline-secondary">
						Reset</button>

				</div>

			</form>

		</div>

	</div>


	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>
</html>
